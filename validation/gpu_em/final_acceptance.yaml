schema_version: 1
title: CORSIKA 8 CUDA EM backend final acceptance

# This matrix deliberately separates statistical consistency from the strict
# point-estimate gates in the original implementation plan.  The final audit
# remains fail-closed while any strict required gate is unresolved.
requirements:
  - id: production_table
    title: PROPOSAL 7.6.2 production table and IGRF13 environment
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_proton_1TeV_emthin1e-4_radio_1000_pooled_v2/cuda/gpu_em/config.yaml
      format: yaml
    checks:
      - name: CUDA EM backend
        field: backend
        operator: equals
        expected: CORSIKA8GpuEm
      - name: deterministic mode
        field: deterministic
        operator: truthy
      - name: table format
        field: table.format_version
        operator: equals
        expected: 10
      - name: PROPOSAL version
        field: table.proposal_version
        operator: equals
        expected: 7.6.2
      - name: stochastic cut
        field: table.stochastic_cut_MeV
        operator: equals
        expected: 0.5
      - name: upper energy
        field: table.energy_max_MeV
        operator: greater_equal
        expected: 1000000000000
      - name: measured rate interpolation error
        field: table.measured_rate_error
        operator: less_equal
        expected: 0.001
      - name: measured inverse-CDF interpolation error
        field: table.measured_inverse_cdf_error
        operator: less_equal
        expected: 0.001
      - name: geomagnetic model
        field: environment.geomagnetic_model
        operator: equals
        expected: IGRF13
      - name: geomagnetic epoch
        field: environment.geomagnetic_year
        operator: equals
        expected: 2025
      - name: 21CMA observer file
        field: environment.antenna_file
        operator: equals
        expected: /home/yuhanglu/21CMA/data/antennas.txt

  - id: artifact_identity
    title: Current application, original application, and table identities
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_proton_1TeV_emthin1e-4_radio_1000_pooled_v2/run_manifest.json
      format: json
    checks:
      - name: current CUDA application SHA-256
        field: artifact_identity.cuda.executable.sha256
        operator: equals
        expected: fbe175bdc556924492c3f3b7e3c81fa5362b5b199797bc5e89c4248abee4fba7
      - name: original CPU application SHA-256
        field: artifact_identity.proposal.executable.sha256
        operator: equals
        expected: 133daa7ee0a4de4ba7355df5facb44e9a09e23bb5fff8b9549e7b6da546daeb9
      - name: production table file SHA-256
        field: artifact_identity.cuda.table.sha256
        operator: equals
        expected: 14eb8d7fe38c8046e3f6e38935a107e08e5e07e45d11496f6cda9e8a41cd9521
      - name: FLUKA environment available
        field: configuration.fluka_environment.FLUPRO_is_directory
        operator: truthy
      - name: CPU ensemble size
        field: configuration.combined_proposal_events
        operator: equals
        expected: 1000
      - name: CUDA ensemble size
        field: configuration.combined_cuda_events
        operator: equals
        expected: 1000

  - id: exact_decision_replay
    title: One original scalar shower replayed exactly on CUDA
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/exact_cuda_replay_original_electron_1TeV_v1/exact_replay_comparison.json
      format: json
    checks:
      - name: replay accepted
        field: accepted
        operator: truthy
      - name: transport replay accepted
        field: transport_replay.accepted
        operator: truthy
      - name: no byte hash mismatch
        field: transport_replay.summary.transport_replay.byte_hash_mismatches
        operator: equals
        expected: 0
      - name: no invalid transport records
        field: transport_replay.summary.transport_replay.invalid_records
        operator: equals
        expected: 0
      - name: capture is non-invasive
        field: capture_noninvasive.accepted
        operator: truthy
      - name: all untaped/taped outputs are bitwise equal
        field: capture_noninvasive.files.*.bitwise_equal
        operator: truthy
        aggregate: all

  - id: pure_em_energy_closure
    title: Pure EM shower energy closure
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_pure_em_energy_10GeV_3_v2/energy_ledger_validation.json
      format: json
    checks:
      - name: ledger accepted
        field: status
        operator: equals
        expected: passed
      - name: complete events
        field: complete_events
        operator: greater_equal
        expected: 3
      - name: closure error
        field: maximum_relative_closure_error
        operator: less_equal
        expected: 0.0001
      - name: complete per-event coverage
        field: records.*.complete_coverage
        operator: truthy
        aggregate: all

  - id: identical_track_radio
    title: CPU/CUDA CoREAS and ZHS projection from identical tracks
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_identical_tracks_radio_1TeV_10_v2/radio_comparison.json
      format: json
    checks:
      - name: comparison accepted
        field: status
        operator: equals
        expected: passed
      - name: identical transport tables
        field: transport_identity.accepted
        operator: truthy
      - name: CoREAS projection accepted
        field: algorithms.CoREAS.accepted
        operator: truthy
      - name: ZHS projection accepted
        field: algorithms.ZHS.accepted
        operator: truthy
      - name: CoREAS maximum normalized difference
        field: algorithms.CoREAS.maximum_normalized_difference
        operator: less_equal
        expected: 0.0001
      - name: ZHS maximum normalized difference
        field: algorithms.ZHS.maximum_normalized_difference
        operator: less_equal
        expected: 0.0001

  - id: fluka_production_integration
    title: FLUKA 2025 process-pool integration in 500 production CUDA showers
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_proton_1TeV_emthin1e-4_radio_1000_pooled_v2/cuda/gpu_em/summary.yaml
      format: yaml
    checks:
      - name: all showers complete
        field: shower_*.complete
        operator: truthy
        aggregate: all
      - name: all statuses complete
        field: shower_*.status
        operator: equals
        expected: complete
        aggregate: all
      - name: FLUKA selected
        field: shower_*.statistics.hadronic_models.low_energy.name
        operator: equals
        expected: FLUKA
        aggregate: all
      - name: FLUKA version
        field: shower_*.statistics.hadronic_models.low_energy.version
        operator: equals
        expected: 2025.0.0
        aggregate: all
      - name: every shower executes FLUKA interactions
        field: shower_*.statistics.hadronic_models.low_energy.interactions
        operator: greater_equal
        expected: 1
        aggregate: all
      - name: process-pool backend
        field: shower_*.statistics.hadronic_process_pool.backend
        operator: equals
        expected: fluka-process
        aggregate: all
      - name: process pool enabled
        field: shower_*.statistics.hadronic_process_pool.enabled
        operator: truthy
        aggregate: all
      - name: four FLUKA workers
        field: shower_*.statistics.hadronic_process_pool.workers
        operator: equals
        expected: 4
        aggregate: all
      - name: registered process sequence accepted
        field: shower_*.statistics.process_registry.accepted
        operator: truthy
        aggregate: all
      - name: no unregistered continuous process
        field: shower_*.statistics.process_registry.unregistered_continuous_processes
        operator: equals
        expected: 0
        aggregate: all
      - name: no memory spill
        field: shower_*.statistics.cpu_memory_spill_particles
        operator: equals
        expected: 0
        aggregate: all
      - name: positive GPU workload
        field: shower_*.statistics.gpu_particles
        operator: greater
        expected: 0
        aggregate: all

  - id: proton_statistical_consistency
    title: Original CPU/CUDA proton ensemble statistical consistency
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_proton_1TeV_emthin1e-4_radio_1000_pooled_v2/comparison.json
      format: json
    checks:
      - name: 1000 original showers
        field: proposal.events
        operator: equals
        expected: 1000
      - name: 1000 CUDA showers
        field: cuda.events
        operator: equals
        expected: 1000
      - name: all curve gates
        field: curves.*.passed
        operator: truthy
        aggregate: all
      - name: Xmax statistical gate
        field: scalars.profile_xmax_charged_gcm2.statistical_pass
        operator: truthy
      - name: charged maximum statistical gate
        field: scalars.profile_charged_max.statistical_pass
        operator: truthy
      - name: charged integral statistical gate
        field: scalars.profile_charged_integral.statistical_pass
        operator: truthy
      - name: photon integral statistical gate
        field: scalars.profile_photon_integral.statistical_pass
        operator: truthy
      - name: deposit statistical gate
        field: scalars.energy_deposit_sum_GeV.statistical_pass
        operator: truthy
      - name: ground count statistical gate
        field: scalars.ground_em_weighted_count.statistical_pass
        operator: truthy
      - name: closure statistical gate
        field: scalars.energy_closure_fraction.statistical_pass
        operator: truthy

  - id: electron_statistical_consistency
    title: Original CPU/CUDA electron ensemble statistical consistency
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_electron_1TeV_1000total_v1/comparison.json
      format: json
    checks:
      - name: 500 original electron showers
        field: proposal.events
        operator: equals
        expected: 500
      - name: 500 CUDA electron showers
        field: cuda.events
        operator: equals
        expected: 500
      - name: all electron curve gates
        field: curves.*.passed
        operator: truthy
        aggregate: all
      - name: all electron scalar statistical gates
        field: scalars.*.statistical_pass
        operator: truthy
        aggregate: all

  - id: photon_statistical_consistency
    title: Original CPU/CUDA photon ensemble statistical consistency
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_photon_1TeV_1000total_v1/comparison.json
      format: json
    checks:
      - name: 500 original photon showers
        field: proposal.events
        operator: equals
        expected: 500
      - name: 500 CUDA photon showers
        field: cuda.events
        operator: equals
        expected: 500
      - name: all photon curve gates
        field: curves.*.passed
        operator: truthy
        aggregate: all
      - name: all photon scalar statistical gates
        field: scalars.*.statistical_pass
        operator: truthy
        aggregate: all

  - id: geomagnetic_pulse_statistics
    title: CoREAS/ZHS geomagnetic pulse amplitude and width distributions
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_proton_1TeV_emthin1e-4_radio_1000_pooled_v2/geomagnetic_pulse_comparison/comparison.json
      format: json
    checks:
      - name: pulse distribution acceptance
        field: acceptance.passed
        operator: truthy
      - name: CoREAS accepted
        field: acceptance.algorithms.CoREAS.passed
        operator: truthy
      - name: ZHS accepted
        field: acceptance.algorithms.ZHS.passed
        operator: truthy
      - name: Holm-Bonferroni family size
        field: acceptance.shape_test_family_size
        operator: equals
        expected: 4

  - id: release_performance
    title: Release single-core CPU/CUDA 1 PeV performance
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_release_performance_1PeV_5rep_v1/benchmark_summary.json
      format: json
    checks:
      - name: benchmark accepted
        field: status
        operator: equals
        expected: passed
      - name: Release build
        field: configuration.build.build_type
        operator: equals
        expected: Release
      - name: five repetitions
        field: configuration.repetitions
        operator: equals
        expected: 5
      - name: external wall speedup
        field: speedup.external_wall
        operator: greater_equal
        expected: 5
      - name: shower timing speedup
        field: speedup.summed_shower_timing
        operator: greater_equal
        expected: 5
      - name: single CPU thread
        field: configuration.single_thread_environment.OMP_NUM_THREADS
        operator: equals
        expected: "1"

  - id: full_automated_tests
    title: CTest and Python validation suites
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_test_acceptance_v2.json
      format: json
    checks:
      - name: unified test acceptance
        field: passed
        operator: truthy
      - name: CTest suite
        field: ctest.passed
        operator: truthy
      - name: at least 32 CTests
        field: ctest.test_count
        operator: greater_equal
        expected: 32
      - name: Python suite
        field: python_unittest.passed
        operator: truthy
      - name: at least 100 Python tests
        field: python_unittest.test_count
        operator: greater_equal
        expected: 100

  - id: strict_one_percent_proton_means
    title: Original-plan strict 1% proton key-mean gate
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_proton_1TeV_emthin1e-4_radio_1000_pooled_v2/comparison.json
      format: json
    checks:
      - name: all strict scalar gates
        field: acceptance.scalar_pass
        operator: truthy

  - id: strict_one_percent_pure_em_means
    title: Original-plan strict 1% electron and photon mean gate
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_electron_1TeV_1000total_v1/comparison.json
      format: json
