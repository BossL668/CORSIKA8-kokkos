      - name: electron strict scalar gate
        field: acceptance.scalar_pass
        operator: truthy

  - id: broadband_radio_energy
    title: Deposited-energy-normalized radio energy in both bands
    classification: required
    evidence:
      path: /home/yuhanglu/21CMA/corsika_validation_results/final_current_original_cuda_proton_1TeV_emthin1e-4_radio_1000_pooled_v2/pooled_radio_comparison.json
      format: json
