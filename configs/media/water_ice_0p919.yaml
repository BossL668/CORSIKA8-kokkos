schema_version: 1
name: water_ice
proposal:
  mean_excitation_energy_eV: 79.7
  density_correction_C: -3.5017
  density_correction_a: 0.09116
  density_correction_m: 3.4773
  density_correction_x0: 0.24
  density_correction_x1: 2.8004
  density_correction_delta0: 0.0
  # This is the PROPOSAL/Sternheimer reference density from
  # Medium::WaterIce.  It is deliberately distinct from the configurable
  # physical transport density (0.919 g/cm3 by default): both the scalar and
  # CUDA LPM implementations scale from this baseline to the local density.
  reference_mass_density_g_per_cm3: 0.918
components:
  # CORSIKA represents elemental targets through nuclear Codes, whose
  # canonical PROPOSAL component name is "nucleus".  The Z/A values below
  # distinguish H and O.  Keeping this identity exact is required for GPU
  # selected-interaction records to replay through scalar PROPOSAL.
  - name: nucleus
    corsika_pid: 1000010010
    nuclear_charge: 1
    atomic_mass_g_per_mol: 1
    number_fraction: 0.6666666666666666
  - name: nucleus
    corsika_pid: 1000080160
    nuclear_charge: 8
    atomic_mass_g_per_mol: 16
    number_fraction: 0.3333333333333333
